<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F6F6">
  <title>نواة | Nawah</title>

  <!-- الخطوط: Amiri لاسم الموقع وأسماء الأنواع، Tajawal للنصوص -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ===== الألوان والخطوط (غيّري هنا لتغيير شكل الموقع كله) ===== */
    :root {
      --orange: #C4640F;        /* اللون الرئيسي: الأزرار والتمييز */
      --orange-dark: #A9540B;
      --tile: #F3E5DA;          /* خلفية الأيقونات الدائرية */
      --bg: #F6F6F6;           /* خلفية الصفحة */
      --card: #F0EFED;         /* خلفية البطاقات */
      --line: #E1DFDB;
      --ink: #2A2018;
      --muted: #7B736B;
      --gold: #E7A21A;         /* النجوم */
      --green: #1F7A47;        /* شارة الدولة */
      --green-bg: #DDF3E5;
      --danger: #A23B2E;
      --font-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
      --font-display: "Amiri", "Times New Roman", serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.6; }
    button, input, select { font-family: inherit; }
    .hidden { display: none !important; }
    :focus-visible { outline: 3px solid rgba(196,100,15,.45); outline-offset: 2px; }
    svg.i { width: 20px; height: 20px; flex: none; }

    /* ===== الإطار: عمود بعرض الجوال، الشريط العلوي والسفلي ثابتان والمحتوى يتحرك ===== */
    .app {
      max-width: 460px; margin: 0 auto; height: 100vh; height: 100dvh;
      display: flex; flex-direction: column; background: var(--bg);
      border-inline: 1px solid var(--line); position: relative; overflow: hidden;
    }
    .content { flex: 1; overflow-y: auto; overscroll-behavior: contain; }

    /* ===== الشريط العلوي ===== */
    .top {
      flex: none; display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px; border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand svg { width: 38px; height: 38px; }
    .brand .ar { font-family: var(--font-display); font-weight: 700; font-size: 28px; color: var(--orange); line-height: 1; }
    .brand .en { font-size: 14px; letter-spacing: .14em; color: var(--muted); }
    .lang {
      border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 6px 12px;
      font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; direction: ltr;
    }
    .lang b { color: var(--muted); }
    .lang b.on { color: var(--orange); }

    /* ===== الأزرار ===== */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      border-radius: 10px; padding: 0 18px; height: 54px; font-size: 17px; font-weight: 700;
      cursor: pointer; transition: transform .12s ease, background .12s ease;
    }
    .btn:active { transform: scale(.985); }
    .btn.primary { background: var(--orange); border: 1px solid var(--orange-dark); color: #fff; }
    .btn.primary:hover { background: var(--orange-dark); }
    .btn.secondary { background: #EFEFEF; border: 1px solid #D9D9D9; color: var(--ink); margin-top: 14px; }
    .btn.small { width: auto; height: 44px; font-size: 15px; padding: 0 24px; margin-top: 0; }
    .status { text-align: center; color: var(--muted); min-height: 24px; margin: 12px 0 0; font-size: 15px; }
    .status.error { color: var(--danger); }

    /* ===== الرئيسية ===== */
    .home { padding: 36px 24px 24px; }
    .big-circle {
      width: 136px; height: 136px; border-radius: 50%; background: var(--tile);
      display: grid; place-items: center; margin: 0 auto 34px; color: var(--orange);
    }
    .big-circle svg { width: 62px; height: 62px; }
    .feature-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 36px; }
    .feature {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 16px 12px 18px; text-align: start;
    }
    .tile {
      width: 44px; height: 44px; border-radius: 12px; background: var(--tile); color: var(--orange);
      display: grid; place-items: center; margin-bottom: 12px;
    }
    .feature b { display: block; font-size: 15px; }
    .feature span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 2px; }

    /* ===== النتيجة ===== */
    .result { padding: 20px 20px 28px; }
    .photo { position: relative; height: 250px; border-radius: 20px; overflow: hidden; background: #E6E2DC; }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .scan { position: absolute; inset: 0; display: none; background: rgba(42,32,24,.18); }
    .scanning .scan { display: block; }
    .scan i {                       /* خط المسح المتحرك */
      position: absolute; inset-inline: 0; top: 0; height: 3px; background: #fff;
      box-shadow: 0 0 16px 4px rgba(196,100,15,.8); animation: scan 1.6s ease-in-out infinite alternate;
    }
    @keyframes scan { from { top: 3%; } to { top: 97%; } }
    .loading { text-align: center; color: var(--muted); margin: 18px 0 4px; font-weight: 500; }
    .name-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .name-row h2 { font-family: var(--font-display); font-size: 42px; line-height: 1.15; margin: 0; color: var(--ink); }
    .badge { background: var(--tile); color: var(--orange-dark); border-radius: 999px; padding: 3px 14px; font-size: 13px; font-weight: 700; }
    .en-name { color: var(--muted); letter-spacing: .12em; font-size: 15px; }
    .desc { margin: 12px 0 18px; font-size: 16px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 12px 16px; }
    .stat .val { font-size: 30px; font-weight: 700; color: var(--orange); line-height: 1.1; }
    .stat .val small { font-size: 12px; font-weight: 500; color: var(--muted); margin-inline-start: 3px; }
    .stat .lbl { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
    .note { font-size: 13px; color: var(--muted); margin: 12px 2px 18px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
    .card p { margin: 0 0 12px; font-weight: 700; }
    .row { display: flex; gap: 10px; }
    .card select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #D9D9D9; font-size: 16px; margin: 12px 0 10px; background: #fff; }
    .unknown { text-align: center; color: var(--muted); padding: 10px 6px 22px; }

    /* ===== الشركات ===== */
    .companies { padding: 14px 16px 24px; }
    .searchbar { display: flex; gap: 10px; align-items: center; }
    .search { position: relative; flex: 1; }
    .search input {
      width: 100%; height: 46px; border: 1px solid #D9D9D9; border-radius: 12px; background: #fff;
      padding: 0 14px; padding-inline-end: 42px; font-size: 15px;
    }
    .search svg { position: absolute; inset-inline-end: 13px; top: 13px; color: var(--muted); }
    .add-btn {
      flex: none; width: 46px; height: 46px; border-radius: 12px; border: 1.5px solid var(--orange);
      background: #fff; color: var(--orange); display: grid; place-items: center; cursor: pointer;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid #D9D9D9; background: #fff;
      border-radius: 999px; padding: 6px 16px; font-size: 14px; cursor: pointer; color: var(--ink);
    }
    .chip svg { width: 15px; height: 15px; }
    .chip.on { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 700; }
    .section-title { display: flex; align-items: center; gap: 8px; font-weight: 700; margin: 18px 2px 10px; }
    .section-title svg { color: var(--gold); fill: var(--gold); }

    .co {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 16px; margin-bottom: 14px;
    }
    .co.featured { border-color: #E2B38D; }
    .co-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .co-name { display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 700; line-height: 1.4; }
    .co-name svg { width: 17px; height: 17px; color: var(--gold); fill: var(--gold); }
    .co-en { color: var(--muted); font-size: 14px; }
    .rating { text-align: center; flex: none; }
    .rating b { display: flex; align-items: center; gap: 4px; color: var(--orange); font-size: 19px; }
    .rating b svg { width: 16px; height: 16px; color: var(--gold); fill: var(--gold); }
    .rating span { font-size: 11.5px; color: var(--muted); }
    .co-desc { color: var(--muted); font-size: 14px; margin: 10px 0; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    .country { background: var(--green-bg); color: var(--green); border-radius: 999px; padding: 1px 12px; font-weight: 700; }
    .meta .city { display: inline-flex; align-items: center; gap: 3px; }
    .meta .city svg { width: 14px; height: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .tag { background: #E6E4E0; border-radius: 8px; padding: 2px 12px; font-size: 13px; font-weight: 700; }
    .contact {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; font-size: 13.5px; color: var(--muted);
    }
    .contact a, .contact span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; direction: ltr; }
    .contact svg { color: var(--orange); width: 16px; height: 16px; }
    .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

    /* نافذة اقتراح شركة */
    .overlay { position: absolute; inset: 0; z-index: 30; background: rgba(30,20,10,.45); display: flex; align-items: flex-end; }
    .sheet { background: var(--bg); width: 100%; border-radius: 22px 22px 0 0; padding: 20px; max-height: 92%; overflow-y: auto; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .sheet-head h3 { margin: 0; font-family: var(--font-display); font-size: 26px; }
    .x { border: 0; background: #E9E7E3; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
    .sheet input { width: 100%; height: 46px; margin: 5px 0; border: 1px solid #D9D9D9; border-radius: 10px; padding: 0 14px; font-size: 16px; background: #fff; }

    /* ===== شريط التنقل السفلي ===== */
    .tabs { flex: none; display: flex; border-top: 1px solid var(--line); background: var(--bg); padding: 8px 12px 4px; }
    .tabs button {
      flex: 1; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500;
      display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 2px;
    }
    .tabs .ico { width: 54px; height: 40px; border-radius: 14px; display: grid; place-items: center; }
    .tabs button.active { color: var(--orange); font-weight: 700; }
    .tabs button.active .ico { background: var(--tile); }
    .tabs button.active::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--orange); }
    .foot { flex: none; text-align: center; font-size: 11px; letter-spacing: .22em; color: #C3BCB3; padding: 8px 0 10px; border-top: 1px solid var(--line); }

    /* ===== شاشة الافتتاح ===== */
    #splash {
      position: fixed; inset: 0; z-index: 50; background: #fff; display: grid; place-content: center; justify-items: center;
      transition: opacity .6s ease;
    }
    #splash.out { opacity: 0; pointer-events: none; }
    #splash svg { width: 260px; height: 208px; animation: rise .9s ease both; }
    #splash .ar { font-family: var(--font-display); font-weight: 700; font-size: 48px; color: #9A4B16; line-height: 1.2; margin-top: 18px; }
    #splash .en { letter-spacing: .5em; color: #C9A98C; font-size: 15px; padding-inline-start: .5em; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>

<!-- ===== الأيقونات والرسمات (تُستخدم بالاسم في كل مكان) ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gBody" cx="34%" cy="28%" r="85%">
      <stop offset="0" stop-color="#B56B3B"/><stop offset=".5" stop-color="#6E3A1D"/><stop offset="1" stop-color="#2E160A"/>
    </radialGradient>
    <linearGradient id="gPit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1DDB1"/><stop offset=".6" stop-color="#C9A265"/><stop offset="1" stop-color="#9C7440"/>
    </linearGradient>
    <linearGradient id="gCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9B98A"/><stop offset="1" stop-color="#8A6234"/>
    </linearGradient>
  </defs>

  <!-- أيقونات خطية -->
  <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.2"/></symbol>

  <symbol id="i-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>

  <!-- تمرة صغيرة للشعار -->
  <symbol id="date-mini" viewBox="0 0 48 48">
    <ellipse cx="24" cy="40" rx="15" ry="3" fill="#000" opacity=".12"/>
    <g transform="rotate(-25 24 24)">
      <ellipse cx="24" cy="25" rx="19" ry="12.5" fill="url(#gBody)"/>
      <ellipse cx="18" cy="20" rx="8" ry="2.4" fill="#F0C79A" opacity=".45"/>
      <ellipse cx="6" cy="25" rx="3" ry="4.5" fill="url(#gCap)"/>
    </g>
  </symbol>

  <!-- التمرة بجانب نواتها (شاشة الافتتاح) -->
  <symbol id="date-art" viewBox="0 0 250 200">
    <ellipse cx="118" cy="168" rx="92" ry="9" fill="#000" opacity=".14"/>
    <g transform="rotate(-22 100 104)">
      <path d="M34 104c0-32 26-52 66-52s70 18 70 52-30 52-70 52-66-20-66-52z" fill="url(#gBody)"/>
      <path d="M52 84c14-16 40-22 66-18" stroke="#F0C79A" stroke-width="4" stroke-linecap="round" fill="none" opacity=".5"/>
      <path d="M50 108c20 8 40 6 58-6M72 132c22 6 46 2 64-12M104 78c14 2 26 10 32 22M60 94c10 2 20 0 28-6" stroke="#1E0E06" stroke-width="2" stroke-linecap="round" fill="none" opacity=".38"/>
      <ellipse cx="32" cy="104" rx="9" ry="14" fill="url(#gCap)"/>
      <path d="M27 98l8 6M27 108l8-4" stroke="#5E3D1C" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="rotate(24 198 138)">
      <ellipse cx="198" cy="138" rx="30" ry="14" fill="#000" opacity=".12" transform="translate(2 12)"/>
      <ellipse cx="198" cy="138" rx="30" ry="14" fill="url(#gPit)"/>
      <path d="M172 138c18-3 38-3 52 0" stroke="#7A5428" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M178 131c10-3 24-3 34-1" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".45"/>
    </g>
    <path d="M152 26c-14-8-30-6-38 2 14-2 24 2 30 10 2-5 5-9 8-12z" fill="#3E8A62"/>
    <path d="M114 28c10 2 22 8 30 10" stroke="#1F5A3E" stroke-width="1.5" stroke-linecap="round" fill="none"/>

</svg>

<!-- ===== شاشة الافتتاح ===== -->
<div id="splash" aria-hidden="true">
  <svg viewBox="0 0 250 200"><use href="#date-art"/></svg>
  <div class="ar">نواة</div>
  <div class="en">NAWAH</div>
</div>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48"><use href="#date-mini"/></svg>
      <span class="ar">نواة</span><span class="en">nawah</span>
    </div>
    <button class="lang" id="langBtn" type="button" aria-label="Language"><b id="langAr" class="on">AR</b> / <b id="langEn">EN</b></button>
  </header>

  <main class="content" id="content">

    <!-- ===== الرئيسية ===== -->
    <section class="home" id="view-home">
      <div class="big-circle"><svg><use href="#i-camera"/></svg></div>

      <!-- الأول يفتح الكاميرا مباشرة، والثاني يفتح معرض الصور -->
      <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button class="btn primary" type="button" id="camBtn"><svg class="i"><use href="#i-camera"/></svg><span data-i18n="openCamera"></span></button>
      <button class="btn secondary" type="button" id="uploadBtn"><svg class="i"><use href="#i-upload"/></svg><span data-i18n="uploadPhoto"></span></button>
      <div class="status" id="status" role="status"></div>

      <div class="feature-row">
        <div class="feature"><div class="tile"><svg class="i"><use href="#i-leaf"/></svg></div><b data-i18n="fType"></b><span data-i18n="fTypeSub"></span></div>
        <div class="feature"><div class="tile"><svg class="i"><use href="#i-bolt"/></svg></div><b data-i18n="fCal"></b><span data-i18n="fCalSub"></span></div>
        <div class="feature"><div class="tile"><svg class="i"><use href="#i-drop"/></svg></div><b data-i18n="fSugar"></b><span data-i18n="fSugarSub"></span></div>
      </div>
    </section>

    <!-- ===== النتيجة ===== -->
    <section class="result hidden" id="view-result">
      <div class="photo" id="photoBox"><img id="photo" alt=""><div class="scan"><i></i></div></div>
      <p class="loading hidden" id="loadingText" data-i18n="scanning"></p>

      <div id="resultBody" class="hidden">
        <div class="name-row"><h2 id="resName"></h2><span class="badge" id="resConf"></span></div>
        <div class="en-name" id="resEn"></div>

        <div id="found">
          <p class="desc" id="resDesc"></p>
          <div class="stats">
            <div class="stat"><div class="val"><span id="vCal100"></span></div><div class="lbl" data-i18n="cal100"></div></div>
            <div class="stat"><div class="val"><span id="vSugar"></span></div><div class="lbl" data-i18n="sugar100"></div></div>
            <div class="stat"><div class="val"><span id="vCalOne"></span></div><div class="lbl" data-i18n="calOne"></div></div>
          </div>
          <p class="note" data-i18n="approx"></p>
        </div>
        <p class="unknown hidden" id="notFound" data-i18n="unknownText"></p>

        <div class="card hidden" id="feedbackBox">
          <p data-i18n="isCorrect"></p>
          <div class="row">
            <button class="btn primary small" type="button" id="yesBtn" data-i18n="yes"></button>
            <button class="btn secondary small" type="button" id="noBtn" data-i18n="no"></button>
          </div>
          <div id="wrongBox" class="hidden">
            <select id="correctSelect" aria-label=""></select>
            <button class="btn primary small" type="button" id="sendWrongBtn" data-i18n="sendCorrection"></button>
          </div>
        </div>
        <p class="status hidden" id="thanks" data-i18n="thanks"></p>
        <button class="btn primary hidden" type="button" id="againBtn"><svg class="i"><use href="#i-camera"/></svg><span data-i18n="again"></span></button>
      </div>
    </section>

    <!-- ===== الشركات ===== -->
    <section class="companies hidden" id="view-companies">
      <div class="searchbar">
        <div class="search">
          <input id="searchInput" type="search" data-i18n-ph="searchPh" autocomplete="off">
          <svg class="i"><use href="#i-search"/></svg>
        </div>
        <button class="add-btn" type="button" id="openSuggest" aria-label="+"><svg class="i"><use href="#i-plus"/></svg></button>
      </div>
      <div class="chips" id="chips"></div>
      <div id="companyList"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="Navigation">
    <button type="button" id="tabHome" class="active"><span class="ico"><svg class="i"><use href="#i-camera"/></svg></span><span data-i18n="tabCamera"></span></button>
    <button type="button" id="tabCompanies"><span class="ico"><svg class="i"><use href="#i-building"/></svg></span><span data-i18n="tabCompanies"></span></button>
  </nav>
  <footer class="foot">NAWAH</footer>

  <!-- نافذة اقتراح شركة -->
  <div class="overlay hidden" id="suggestOverlay">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <h3 data-i18n="suggestTitle"></h3>
        <button class="x" type="button" id="closeSuggest" aria-label="close"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <input id="sName" data-i18n-ph="phName" maxlength="80">
      <input id="sCountry" list="countries" data-i18n-ph="phCountry" maxlength="40">
      <datalist id="countries">
        <option value="السعودية"><option value="الإمارات"><option value="البحرين"><option value="الأردن"><option value="ليبيا">
        <option value="مصر"><option value="تونس"><option value="الجزائر"><option value="العراق"><option value="الكويت">
        <option value="عمان"><option value="قطر"><option value="فلسطين"><option value="المغرب"><option value="السودان">
      </datalist>
      <input id="sCity" data-i18n-ph="phCity" maxlength="60">
      <input id="sSite" data-i18n-ph="phSite" maxlength="120" inputmode="url" dir="ltr">
      <input id="sPhone" data-i18n-ph="phPhone" maxlength="30" inputmode="tel" dir="ltr">
      <button class="btn primary" type="button" id="sendSuggestBtn" style="margin-top:12px" data-i18n="sendSuggest"></button>
      <p class="status" id="sMsg" role="status"></p>
    </div>
  </div>
</div>

<script>
  /* ============ النصوص بالعربي والإنجليزي ============ */
  const T = {
    ar: {
      openCamera: "افتح الكاميرا", uploadPhoto: "ارفع صورة",
      fType: "النوع", fTypeSub: "تعرف على نوع التمر",
      fCal: "السعرات", fCalSub: "القيمة الغذائية",
      fSugar: "السكر", fSugarSub: "تأثير على سكر الدم",
      scanning: "جارٍ تحليل التمرة…", errorGeneric: "حدث خطأ، حاول مرة أخرى.",
      cal100: "سعرات لكل 100 جم", sugar100: "سكر (جم) لكل 100 جم", calOne: "سعرات التمرة الواحدة",
      approx: "القيم تقريبية وتختلف حسب حجم التمرة ودرجة نضجها.",
      confidence: "نسبة الثقة", lowConf: "الثقة منخفضة",
      unknownTitle: "لم نستطع تحديد النوع", unknownText: "صوّر تمرة واحدة بإضاءة جيدة وخلفية بسيطة، ثم حاول مرة أخرى.",
      isCorrect: "هل النوع صحيح؟", yes: "نعم", no: "لا", sendCorrection: "إرسال التصحيح", pickVariety: "اختر النوع الصحيح",
      thanks: "شكراً لك، ملاحظتك تساعدنا على التحسّن.", again: "حلّل تمرة أخرى",
      tabCamera: "الكاميرا", tabCompanies: "شركات التمور",
      searchPh: "ابحث عن شركة أو نوع تمر...", all: "الكل", featured: "شركات مميزة", others: "جميع الشركات",
      rating: "التقييم", since: "منذ", noResults: "لا توجد شركات مطابقة للبحث.",
      suggestTitle: "اقترح شركة", phName: "اسم الشركة", phCountry: "الدولة", phCity: "المدينة",
      phSite: "الموقع الإلكتروني (اختياري)", phPhone: "رقم الهاتف (اختياري)",
      sendSuggest: "أرسل الاقتراح", suggestOk: "وصل اقتراحك، وسنراجعه قريباً.", suggestNeedName: "اكتب اسم الشركة أولاً."
    },
    en: {
      openCamera: "Open camera", uploadPhoto: "Upload a photo",
      fType: "Variety", fTypeSub: "Identify the date type",
      fCal: "Calories", fCalSub: "Nutrition value",
      fSugar: "Sugar", fSugarSub: "Effect on blood sugar",
      scanning: "Analyzing your date…", errorGeneric: "Something went wrong. Please try again.",
      cal100: "kcal per 100 g", sugar100: "Sugar (g) per 100 g", calOne: "kcal per date",
      approx: "Values are approximate and vary with size and ripeness.",
      confidence: "Confidence", lowConf: "Low confidence",
      unknownTitle: "Couldn't identify it", unknownText: "Photograph a single date in good light on a plain background, then try again.",
      isCorrect: "Is this variety correct?", yes: "Yes", no: "No", sendCorrection: "Send correction", pickVariety: "Choose the correct variety",
      thanks: "Thank you, your feedback helps us improve.", again: "Analyze another date",
      tabCamera: "Camera", tabCompanies: "Date companies",
      searchPh: "Search a company or date variety...", all: "All", featured: "Featured companies", others: "All companies",
      rating: "Rating", since: "Since", noResults: "No companies match your search.",
      suggestTitle: "Suggest a company", phName: "Company name", phCountry: "Country", phCity: "City",
      phSite: "Website (optional)", phPhone: "Phone (optional)",
      sendSuggest: "Send suggestion", suggestOk: "Suggestion received. We'll review it soon.", suggestNeedName: "Enter the company name first."
    }
  };
  // أسماء الدول بالإنجليزي (لو الدولة غير موجودة هنا تظهر كما هي)
  const COUNTRY_EN = {
    "السعودية": "Saudi Arabia", "الإمارات": "UAE", "البحرين": "Bahrain", "الأردن": "Jordan", "ليبيا": "Libya",
    "مصر": "Egypt", "تونس": "Tunisia", "الجزائر": "Algeria", "العراق": "Iraq", "الكويت": "Kuwait",
    "عمان": "Oman", "قطر": "Qatar", "فلسطين": "Palestine", "المغرب": "Morocco", "السودان": "Sudan"
  };

  const $ = id => document.getElementById(id);
  let lang = "ar";
  const t = key => T[lang][key];
  const fmt = n => (Number.isInteger(n) ? String(n) : Number(n).toFixed(1));

  let analysisId = null;
  let lastData = null;         // آخر نتيجة تحليل (لنعيد عرضها عند تبديل اللغة)
  let currentView = "home";
  let varietyList = [];        // أنواع التمور من القاعدة
  let companyList = [];        // الشركات من القاعدة
  let countryFilter = "";      // "" = الكل
  let searchText = "";

  const countryName = c => (lang === "en" && COUNTRY_EN[c]) || c;
  const varietyName = ar => {
    const v = varietyList.find(x => x.name_ar === ar);
    return lang === "en" && v && v.name_en ? v.name_en : ar;
  };

  /* ============ اللغة ============ */
  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    $("langAr").classList.toggle("on", lang === "ar");
    $("langEn").classList.toggle("on", lang === "en");
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
    $("correctSelect").setAttribute("aria-label", t("pickVariety"));
    renderCompanies();
    if (lastData) fillResult(lastData);
  }
  $("langBtn").onclick = () => { lang = lang === "ar" ? "en" : "ar"; applyLang(); };

  /* ============ التنقل بين الصفحات ============ */
  function showView(name) {
    currentView = name;
    $("view-home").classList.toggle("hidden", name !== "home");
    $("view-result").classList.toggle("hidden", name !== "result");
    $("view-companies").classList.toggle("hidden", name !== "companies");
    $("tabHome").classList.toggle("active", name !== "companies");
    $("tabCompanies").classList.toggle("active", name === "companies");
    if (name === "companies") loadCompanies();
    $("content").scrollTop = 0;
  }
  $("tabHome").onclick = () => showView(currentView === "companies" ? (lastData ? "result" : "home") : currentView);
  $("tabCompanies").onclick = () => showView("companies");

  /* ============ رفع الصورة وتحليلها ============ */
  $("camBtn").onclick = () => $("camInput").click();
  $("uploadBtn").onclick = () => $("fileInput").click();
  $("camInput").onchange = e => analyze(e.target.files[0]);
  $("fileInput").onchange = e => analyze(e.target.files[0]);

  function setStatus(text, isError) {
    $("status").textContent = text || "";
    $("status").classList.toggle("error", !!isError);
  }

  async function analyze(file) {
    if (!file) return;
    lastData = null;
    setStatus("");
    $("photo").src = URL.createObjectURL(file);
    $("photoBox").classList.add("scanning");           // خط المسح
    $("loadingText").classList.remove("hidden");
    $("resultBody").classList.add("hidden");
    showView("result");

    const form = new FormData();
    form.append("file", file);
    try {
      const res = await fetch("/api/analyze", { method: "POST", body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || t("errorGeneric"));
      lastData = data;
      analysisId = data.analysis_id;
      fillResult(data);
    } catch (err) {
      showView("home");
      setStatus(err.message || t("errorGeneric"), true);
    } finally {
      $("photoBox").classList.remove("scanning");
      $("loadingText").classList.add("hidden");
      $("camInput").value = ""; $("fileInput").value = "";
    }
  }

  function fillResult(data) {
    $("resultBody").classList.remove("hidden");
    $("againBtn").classList.remove("hidden");
    $("found").classList.toggle("hidden", !data.recognized);
    $("notFound").classList.toggle("hidden", data.recognized);
    if (!$("thanks").classList.contains("done")) $("feedbackBox").classList.remove("hidden");

    if (!data.recognized) {
      $("resName").textContent = t("unknownTitle");
      $("resEn").textContent = "";
      $("resConf").classList.add("hidden");
      return;
    }
    const v = data.variety;
    $("resName").textContent = lang === "ar" ? v.name_ar : v.name_en;
    $("resEn").textContent = lang === "ar" ? v.name_en : v.name_ar;
    $("resDesc").textContent = v.description || "";
    $("resConf").classList.remove("hidden");
    $("resConf").textContent = data.confidence < 0.6 ? t("lowConf")
      : `${t("confidence")} ${Math.round(data.confidence * 100)}%`;
    $("vCal100").textContent = fmt(v.calories_per_100g);
    $("vSugar").textContent = fmt(v.sugar_per_100g);
    $("vCalOne").textContent = fmt(v.calories_per_date);
  }

  $("againBtn").onclick = () => {
    lastData = null;
    $("thanks").classList.remove("done"); $("thanks").classList.add("hidden");
    $("wrongBox").classList.add("hidden");
    showView("home");
  };

  /* ============ رأي المستخدم ============ */
  async function loadVarieties() {
    if (varietyList.length) return;
    try { varietyList = await (await fetch("/api/varieties")).json(); } catch (e) {}
  }

  $("noBtn").onclick = async () => {
    await loadVarieties();
    $("correctSelect").innerHTML = "";
    varietyList.forEach(v => {
      const o = document.createElement("option");
      o.value = v.name_ar;                                   // نحفظ الاسم العربي دائماً
      o.textContent = lang === "ar" ? v.name_ar : v.name_en;
      $("correctSelect").appendChild(o);
    });
    $("wrongBox").classList.remove("hidden");
  };
  $("yesBtn").onclick = () => sendFeedback(true);
  $("sendWrongBtn").onclick = () => sendFeedback(false);

  async function sendFeedback(correct) {
    await fetch(`/api/analyses/${analysisId}/feedback`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ correct, corrected_variety: correct ? null : $("correctSelect").value })
    });
    $("feedbackBox").classList.add("hidden");
    $("thanks").classList.remove("hidden"); $("thanks").classList.add("done");
  }

  /* ============ الشركات ============ */
  // ننشئ العناصر بـ textContent حتى لا يُنفَّذ أي كود داخل أسماء الشركات
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function icon(name, cls) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("class", "i" + (cls ? " " + cls : ""));
    const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
    u.setAttribute("href", "#i-" + name);
    s.appendChild(u);
    return s;
  }

  async function loadCompanies() {
    await loadVarieties();
    try { companyList = await (await fetch("/api/companies")).json(); } catch (e) { companyList = []; }
    renderCompanies();
  }

  // هل تطابق الشركة نص البحث؟ نبحث في الاسم والوصف والدولة والمدينة والأنواع (بالعربي والإنجليزي)
  function matchesSearch(c, q) {
    if (!q) return true;
    const text = [c.name, c.name_en, c.description, c.country, COUNTRY_EN[c.country], c.city,
                  ...c.varieties, ...c.varieties.map(v => varietyName(v)), ...c.varieties.map(v => {
                    const x = varietyList.find(y => y.name_ar === v); return x ? x.name_en : "";
                  })].join(" ").toLowerCase();
    return text.includes(q.toLowerCase());
  }

  function companyCard(c) {
    const card = el("article", "co" + (c.featured ? " featured" : ""));

    const head = el("div", "co-head");
    const names = el("div");
    const nameRow = el("div", "co-name");
    nameRow.appendChild(el("span", "", lang === "en" && c.name_en ? c.name_en : c.name));
    if (c.featured) nameRow.appendChild(icon("star"));
    names.appendChild(nameRow);
    const second = lang === "en" ? c.name : c.name_en;
    if (second) names.appendChild(el("div", "co-en", second));
    head.appendChild(names);
    if (c.rating !== null && c.rating !== undefined) {
      const r = el("div", "rating");
      const b = el("b"); b.appendChild(icon("star")); b.appendChild(el("span", "", Number(c.rating).toFixed(1)));
      r.appendChild(b); r.appendChild(el("span", "", t("rating")));
      head.appendChild(r);
    }
    card.appendChild(head);

    if (c.description) card.appendChild(el("p", "co-desc", c.description));

    const meta = el("div", "meta");
    if (c.country) meta.appendChild(el("span", "country", countryName(c.country)));
    if (c.city) { const s = el("span", "city"); s.appendChild(icon("pin")); s.appendChild(el("span", "", c.city)); meta.appendChild(s); }
    if (c.founded_year) meta.appendChild(el("span", "", `${t("since")} ${c.founded_year}`));
    card.appendChild(meta);

    if (c.varieties.length) {
      const tags = el("div", "tags");
      c.varieties.forEach(v => tags.appendChild(el("span", "tag", varietyName(v))));
      card.appendChild(tags);
    }

    const hasSite = c.website && /^https?:\/\//i.test(c.website);
    if (hasSite || c.phone) {
      const contact = el("div", "contact");
      if (hasSite) {                                            // نعرض الرابط فقط إذا بدأ بـ http
        const a = el("a");
        a.href = c.website; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.appendChild(el("span", "", c.website.replace(/^https?:\/\//i, "").replace(/\/$/, "")));
        a.appendChild(icon("globe"));
        contact.appendChild(a);
      }
      if (c.phone) {
        const a = el("a");
        a.href = "tel:" + c.phone.replace(/[^\d+]/g, "");
        a.appendChild(el("span", "", c.phone));
        a.appendChild(icon("phone"));
        contact.appendChild(a);
      }
      card.appendChild(contact);
    }
    return card;
  }

  function renderChips() {
    const box = $("chips");
    box.innerHTML = "";
    const countries = [...new Set(companyList.map(c => c.country).filter(Boolean))];
    const all = el("button", "chip" + (countryFilter === "" ? " on" : ""));
    all.type = "button"; all.appendChild(icon("filter")); all.appendChild(el("span", "", t("all")));
    all.onclick = () => { countryFilter = ""; renderCompanies(); };
    box.appendChild(all);
    countries.forEach(c => {
      const b = el("button", "chip" + (countryFilter === c ? " on" : ""), countryName(c));
      b.type = "button";
      b.onclick = () => { countryFilter = c; renderCompanies(); };
      box.appendChild(b);
    });
  }

  function renderCompanies() {
    renderChips();
    const box = $("companyList");
    box.innerHTML = "";
    const shown = companyList.filter(c =>
      (!countryFilter || c.country === countryFilter) && matchesSearch(c, searchText.trim()));
    if (!shown.length) { box.appendChild(el("p", "empty", t("noResults"))); return; }

    const featured = shown.filter(c => c.featured);
    const others = shown.filter(c => !c.featured);
    if (featured.length) {
      const h = el("div", "section-title"); h.appendChild(icon("star")); h.appendChild(el("span", "", t("featured")));
      box.appendChild(h);
      featured.forEach(c => box.appendChild(companyCard(c)));
    }
    if (others.length) {
      box.appendChild(el("div", "section-title", t("others")));
      others.forEach(c => box.appendChild(companyCard(c)));
    }
  }
  $("searchInput").oninput = e => { searchText = e.target.value; renderCompanies(); };

  /* ============ اقتراح شركة ============ */
  const openSheet = () => { $("sMsg").textContent = ""; $("suggestOverlay").classList.remove("hidden"); $("sName").focus(); };
  const closeSheet = () => $("suggestOverlay").classList.add("hidden");
  $("openSuggest").onclick = openSheet;
  $("closeSuggest").onclick = closeSheet;
  $("suggestOverlay").onclick = e => { if (e.target === $("suggestOverlay")) closeSheet(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  $("sendSuggestBtn").onclick = async () => {
    const name = $("sName").value.trim();
    if (!name) { $("sMsg").textContent = t("suggestNeedName"); $("sMsg").classList.add("error"); return; }
    const res = await fetch("/api/suggest", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, country: $("sCountry").value, city: $("sCity").value,
                             website: $("sSite").value, phone: $("sPhone").value })
    });
    $("sMsg").classList.toggle("error", !res.ok);
    $("sMsg").textContent = res.ok ? t("suggestOk") : t("errorGeneric");
    if (res.ok) {
      ["sName", "sCountry", "sCity", "sSite", "sPhone"].forEach(id => $(id).value = "");
      setTimeout(closeSheet, 1400);
    }
  };

  /* ============ التشغيل الأول ============ */
  applyLang();
  loadVarieties();
  // شاشة الافتتاح تظهر مرة واحدة في الجلسة
  let seen = false;
  try { seen = sessionStorage.getItem("nawahSplash") === "1"; sessionStorage.setItem("nawahSplash", "1"); } catch (e) {}
  if (seen) { $("splash").classList.add("hidden"); }
  else { setTimeout(() => $("splash").classList.add("out"), 1500); setTimeout(() => $("splash").classList.add("hidden"), 2200); }
</script>
</body>
</html>
