<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F6F6">
  <title>نواة | Nawah</title>

  <!-- الخطوط: Amiri لاسم الموقع وأسماء الأنواع، Tajawal للنصوص -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ===== الألوان والخطوط (غيّري هنا لتغيير شكل الموقع كله) ===== */
    :root {
      --orange: #C4640F;        /* اللون الرئيسي: الأزرار والتمييز */
      --orange-dark: #A9540B;
      --tile: #F3E5DA;          /* خلفية الأيقونات الدائرية */
      --bg: #F6F6F6;           /* خلفية الصفحة */
      --card: #F0EFED;         /* خلفية البطاقات */
      --line: #E1DFDB;
      --ink: #2A2018;
      --muted: #7B736B;
      --gold: #E7A21A;         /* النجوم */
      --green: #1F7A47;        /* شارة الدولة */
      --green-bg: #DDF3E5;
      --danger: #A23B2E;
      --font-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
      --font-display: "Amiri", "Times New Roman", serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.6; }
    button, input, select { font-family: inherit; }
    .hidden { display: none !important; }
    :focus-visible { outline: 3px solid rgba(196,100,15,.45); outline-offset: 2px; }
    svg.i { width: 20px; height: 20px; flex: none; }

    /* ===== الإطار: عمود بعرض الجوال، الشريط العلوي والسفلي ثابتان والمحتوى يتحرك ===== */
    .app {
      max-width: 460px; margin: 0 auto; height: 100vh; height: 100dvh;
      display: flex; flex-direction: column; background: var(--bg);
      border-inline: 1px solid var(--line); position: relative; overflow: hidden;
    }
    .content { flex: 1; overflow-y: auto; overscroll-behavior: contain; }

    /* ===== الشريط العلوي ===== */
    .top {
      flex: none; display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px; border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand img { width: 44px; height: auto; }
    .brand .ar { font-family: var(--font-display); font-weight: 700; font-size: 28px; color: var(--orange); line-height: 1; }
    .brand .en { font-size: 14px; letter-spacing: .14em; color: var(--muted); }
    .lang {
      border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 6px 12px;
      font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; direction: ltr;
    }
    .lang b { color: var(--muted); }
    .lang b.on { color: var(--orange); }

    /* ===== الأزرار ===== */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      border-radius: 10px; padding: 0 18px; height: 54px; font-size: 17px; font-weight: 700;
      cursor: pointer; transition: transform .12s ease, background .12s ease;
    }
    .btn:active { transform: scale(.985); }
    .btn.primary { background: var(--orange); border: 1px solid var(--orange-dark); color: #fff; }
    .btn.primary:hover { background: var(--orange-dark); }
    .btn.secondary { background: #EFEFEF; border: 1px solid #D9D9D9; color: var(--ink); margin-top: 14px; }
    .btn.small { width: auto; height: 44px; font-size: 15px; padding: 0 24px; margin-top: 0; }
    .status { text-align: center; color: var(--muted); min-height: 24px; margin: 12px 0 0; font-size: 15px; }
    .status.error { color: var(--danger); }

    /* ===== الرئيسية ===== */
    .home { padding: 36px 24px 24px; }
    .big-circle {
      width: 136px; height: 136px; border-radius: 50%; background: var(--tile);
      display: grid; place-items: center; margin: 0 auto 34px; color: var(--orange);
    }
    .big-circle svg { width: 62px; height: 62px; }
    .feature-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 36px; }
    .feature {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 16px 12px 18px; text-align: start;
    }
    .tile {
      width: 44px; height: 44px; border-radius: 12px; background: var(--tile); color: var(--orange);
      display: grid; place-items: center; margin-bottom: 12px;
    }
    .feature b { display: block; font-size: 15px; }
    .feature span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 2px; }

    /* ===== النتيجة ===== */
    .result { padding: 20px 20px 28px; }
    .photo { position: relative; height: 250px; border-radius: 20px; overflow: hidden; background: #E6E2DC; }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .scan { position: absolute; inset: 0; display: none; background: rgba(42,32,24,.18); }
    .scanning .scan { display: block; }
    .scan i {                       /* خط المسح المتحرك */
      position: absolute; inset-inline: 0; top: 0; height: 3px; background: #fff;
      box-shadow: 0 0 16px 4px rgba(196,100,15,.8); animation: scan 1.6s ease-in-out infinite alternate;
    }
    @keyframes scan { from { top: 3%; } to { top: 97%; } }
    .loading { text-align: center; color: var(--muted); margin: 18px 0 4px; font-weight: 500; }
    .name-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .name-row h2 { font-family: var(--font-display); font-size: 42px; line-height: 1.15; margin: 0; color: var(--ink); }
    .badge { background: var(--tile); color: var(--orange-dark); border-radius: 999px; padding: 3px 14px; font-size: 13px; font-weight: 700; }
    .en-name { color: var(--muted); letter-spacing: .12em; font-size: 15px; }
    .desc { margin: 12px 0 18px; font-size: 16px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 12px 16px; }
    .stat .val { font-size: 30px; font-weight: 700; color: var(--orange); line-height: 1.1; }
    .stat .val small { font-size: 12px; font-weight: 500; color: var(--muted); margin-inline-start: 3px; }
    .stat .lbl { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
    .note { font-size: 13px; color: var(--muted); margin: 12px 2px 18px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
    .card p { margin: 0 0 12px; font-weight: 700; }
    .row { display: flex; gap: 10px; }
    .card select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #D9D9D9; font-size: 16px; margin: 12px 0 10px; background: #fff; }
    .unknown { text-align: center; color: var(--muted); padding: 10px 6px 22px; }


    /* ===== شاشة الافتتاح ===== */
    #splash {
      position: fixed; inset: 0; z-index: 50; background: #fff; display: grid; place-content: center; justify-items: center;
      transition: opacity .6s ease;
    }
    #splash.out { opacity: 0; pointer-events: none; }
    #splash img { width: 300px; max-width: 80vw; animation: rise .9s ease both; }
    #splash .ar { font-family: var(--font-display); font-weight: 700; font-size: 46px; color: #B5714A; line-height: 1.2; margin-top: 28px; }
    #splash .en { letter-spacing: .5em; color: #DDB89C; font-size: 15px; padding-inline-start: .5em; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>

<!-- ===== الأيقونات والرسمات (تُستخدم بالاسم في كل مكان) ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gBody" cx="34%" cy="28%" r="85%">
      <stop offset="0" stop-color="#B56B3B"/><stop offset=".5" stop-color="#6E3A1D"/><stop offset="1" stop-color="#2E160A"/>
    </radialGradient>
    <linearGradient id="gPit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1DDB1"/><stop offset=".6" stop-color="#C9A265"/><stop offset="1" stop-color="#9C7440"/>
    </linearGradient>
    <linearGradient id="gCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9B98A"/><stop offset="1" stop-color="#8A6234"/>
    </linearGradient>
  </defs>

  <!-- أيقونات خطية -->
  <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.2"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></symbol>

  <!-- تمرة صغيرة للشعار -->
  <symbol id="date-mini" viewBox="0 0 48 48">
    <ellipse cx="24" cy="40" rx="15" ry="3" fill="#000" opacity=".12"/>
    <g transform="rotate(-25 24 24)">
      <ellipse cx="24" cy="25" rx="19" ry="12.5" fill="url(#gBody)"/>
      <ellipse cx="18" cy="20" rx="8" ry="2.4" fill="#F0C79A" opacity=".45"/>
      <ellipse cx="6" cy="25" rx="3" ry="4.5" fill="url(#gCap)"/>
    </g>
  </symbol>

  <!-- التمرة بجانب نواتها (شاشة الافتتاح) -->
  <symbol id="date-art" viewBox="0 0 250 200">
    <ellipse cx="118" cy="168" rx="92" ry="9" fill="#000" opacity=".14"/>
    <g transform="rotate(-22 100 104)">
      <path d="M34 104c0-32 26-52 66-52s70 18 70 52-30 52-70 52-66-20-66-52z" fill="url(#gBody)"/>
      <path d="M52 84c14-16 40-22 66-18" stroke="#F0C79A" stroke-width="4" stroke-linecap="round" fill="none" opacity=".5"/>
      <path d="M50 108c20 8 40 6 58-6M72 132c22 6 46 2 64-12M104 78c14 2 26 10 32 22M60 94c10 2 20 0 28-6" stroke="#1E0E06" stroke-width="2" stroke-linecap="round" fill="none" opacity=".38"/>
      <ellipse cx="32" cy="104" rx="9" ry="14" fill="url(#gCap)"/>
      <path d="M27 98l8 6M27 108l8-4" stroke="#5E3D1C" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="rotate(24 198 138)">
      <ellipse cx="198" cy="138" rx="30" ry="14" fill="#000" opacity=".12" transform="translate(2 12)"/>
      <ellipse cx="198" cy="138" rx="30" ry="14" fill="url(#gPit)"/>
      <path d="M172 138c18-3 38-3 52 0" stroke="#7A5428" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M178 131c10-3 24-3 34-1" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".45"/>
    </g>
    <path d="M152 26c-14-8-30-6-38 2 14-2 24 2 30 10 2-5 5-9 8-12z" fill="#3E8A62"/>
    <path d="M114 28c10 2 22 8 30 10" stroke="#1F5A3E" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </symbol>
</svg>

<!-- ===== شاشة الافتتاح ===== -->
<div id="splash" aria-hidden="true">
  <img src="/static/date.png" alt="">
  <div class="ar">نـواة</div>
  <div class="en">nawah</div>
</div>

<div class="app">
  <header class="top">
    <div class="brand">
      <img src="/static/date-mini.png" alt="">
      <span class="ar">نواة</span><span class="en">nawah</span>
    </div>
    <button class="lang" id="langBtn" type="button" aria-label="Language"><b id="langAr" class="on">AR</b> / <b id="langEn">EN</b></button>
  </header>

  <main class="content" id="content">

    <!-- ===== الرئيسية ===== -->
    <section class="home" id="view-home">
      <div class="big-circle"><svg><use href="#i-camera"/></svg></div>

      <!-- الأول يفتح الكاميرا مباشرة، والثاني يفتح معرض الصور -->
      <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button class="btn primary" type="button" id="camBtn"><svg class="i"><use href="#i-camera"/></svg><span data-i18n="openCamera"></span></button>
      <button class="btn secondary" type="button" id="uploadBtn"><svg class="i"><use href="#i-upload"/></svg><span data-i18n="uploadPhoto"></span></button>
      <div class="status" id="status" role="status"></div>

      <div class="feature-row">
        <div class="feature"><div class="tile"><svg class="i"><use href="#i-leaf"/></svg></div><b data-i18n="fType"></b><span data-i18n="fTypeSub"></span></div>
        <div class="feature"><div class="tile"><svg class="i"><use href="#i-bolt"/></svg></div><b data-i18n="fCal"></b><span data-i18n="fCalSub"></span></div>
        <div class="feature"><div class="tile"><svg class="i"><use href="#i-drop"/></svg></div><b data-i18n="fSugar"></b><span data-i18n="fSugarSub"></span></div>
      </div>
    </section>

    <!-- ===== النتيجة ===== -->
    <section class="result hidden" id="view-result">
      <div class="photo" id="photoBox"><img id="photo" alt=""><div class="scan"><i></i></div></div>
      <p class="loading hidden" id="loadingText" data-i18n="scanning"></p>

      <div id="resultBody" class="hidden">
        <div class="name-row"><h2 id="resName"></h2><span class="badge" id="resConf"></span></div>
        <div class="en-name" id="resEn"></div>

        <div id="found">
          <p class="desc" id="resDesc"></p>
          <div class="stats">
            <div class="stat"><div class="val"><span id="vCal100"></span></div><div class="lbl" data-i18n="cal100"></div></div>
            <div class="stat"><div class="val"><span id="vSugar"></span></div><div class="lbl" data-i18n="sugar100"></div></div>
            <div class="stat"><div class="val"><span id="vCalOne"></span></div><div class="lbl" data-i18n="calOne"></div></div>
          </div>
          <p class="note" data-i18n="approx"></p>
        </div>
        <p class="unknown hidden" id="notFound" data-i18n="unknownText"></p>

        <div class="card hidden" id="feedbackBox">
          <p data-i18n="isCorrect"></p>
          <div class="row">
            <button class="btn primary small" type="button" id="yesBtn" data-i18n="yes"></button>
            <button class="btn secondary small" type="button" id="noBtn" data-i18n="no"></button>
          </div>
          <div id="wrongBox" class="hidden">
            <select id="correctSelect" aria-label=""></select>
            <button class="btn primary small" type="button" id="sendWrongBtn" data-i18n="sendCorrection"></button>
          </div>
        </div>
        <p class="status hidden" id="thanks" data-i18n="thanks"></p>
        <button class="btn primary hidden" type="button" id="againBtn"><svg class="i"><use href="#i-camera"/></svg><span data-i18n="again"></span></button>
      </div>
    </section>
  </main>

  <footer class="foot">NAWAH</footer>
</div>

<script>
  /* ============ النصوص بالعربي والإنجليزي ============ */
  const T = {
    ar: {
      openCamera: "افتح الكاميرا", uploadPhoto: "ارفع صورة",
      fType: "النوع", fTypeSub: "تعرف على نوع التمر",
      fCal: "السعرات", fCalSub: "القيمة الغذائية",
      fSugar: "السكر", fSugarSub: "تأثير على سكر الدم",
      scanning: "جارٍ تحليل التمرة…", errorGeneric: "حدث خطأ، حاول مرة أخرى.",
      cal100: "سعرات لكل 100 جم", sugar100: "سكر (جم) لكل 100 جم", calOne: "سعرات التمرة الواحدة",
      approx: "القيم تقريبية وتختلف حسب حجم التمرة ودرجة نضجها.",
      confidence: "نسبة الثقة", lowConf: "الثقة منخفضة",
      unknownTitle: "لم نستطع تحديد النوع", unknownText: "صوّر تمرة واحدة بإضاءة جيدة وخلفية بسيطة، ثم حاول مرة أخرى.",
      isCorrect: "هل النوع صحيح؟", yes: "نعم", no: "لا", sendCorrection: "إرسال التصحيح", pickVariety: "اختر النوع الصحيح",
      thanks: "شكراً لك، ملاحظتك تساعدنا على التحسّن.", again: "حلّل تمرة أخرى",
    },
    en: {
      openCamera: "Open camera", uploadPhoto: "Upload a photo",
      fType: "Variety", fTypeSub: "Identify the date type",
      fCal: "Calories", fCalSub: "Nutrition value",
      fSugar: "Sugar", fSugarSub: "Effect on blood sugar",
      scanning: "Analyzing your date…", errorGeneric: "Something went wrong. Please try again.",
      cal100: "kcal per 100 g", sugar100: "Sugar (g) per 100 g", calOne: "kcal per date",
      approx: "Values are approximate and vary with size and ripeness.",
      confidence: "Confidence", lowConf: "Low confidence",
      unknownTitle: "Couldn't identify it", unknownText: "Photograph a single date in good light on a plain background, then try again.",
      isCorrect: "Is this variety correct?", yes: "Yes", no: "No", sendCorrection: "Send correction", pickVariety: "Choose the correct variety",
      thanks: "Thank you, your feedback helps us improve.", again: "Analyze another date",
    }
  };

  const $ = id => document.getElementById(id);
  let lang = "ar";
  const t = key => T[lang][key];
  const fmt = n => (Number.isInteger(n) ? String(n) : Number(n).toFixed(1));

  let analysisId = null;
  let lastData = null;         // آخر نتيجة تحليل (لنعيد عرضها عند تبديل اللغة)
  let currentView = "home";
  let varietyList = [];        // أنواع التمور من القاعدة

  const varietyName = ar => {
    const v = varietyList.find(x => x.name_ar === ar);
    return lang === "en" && v && v.name_en ? v.name_en : ar;
  };

  /* ============ اللغة ============ */
  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    $("langAr").classList.toggle("on", lang === "ar");
    $("langEn").classList.toggle("on", lang === "en");
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
    $("correctSelect").setAttribute("aria-label", t("pickVariety"));
    if (lastData) fillResult(lastData);
  }
  $("langBtn").onclick = () => { lang = lang === "ar" ? "en" : "ar"; applyLang(); };

  /* ============ التنقل بين الصفحات ============ */
  function showView(name) {
    currentView = name;
    $("view-home").classList.toggle("hidden", name !== "home");
    $("view-result").classList.toggle("hidden", name !== "result");
    $("content").scrollTop = 0;
  }

  /* ============ رفع الصورة وتحليلها ============ */
  $("camBtn").onclick = () => $("camInput").click();
  $("uploadBtn").onclick = () => $("fileInput").click();
  $("camInput").onchange = e => analyze(e.target.files[0]);
  $("fileInput").onchange = e => analyze(e.target.files[0]);

  function setStatus(text, isError) {
    $("status").textContent = text || "";
    $("status").classList.toggle("error", !!isError);
  }

  // نصغّر الصورة قبل الرفع (أطول ضلع 1600 بكسل) حتى لا تتجاوز حد الاستضافة (4.5 ميجابايت)
  // ولأن الذكاء الاصطناعي لا يحتاج صورة أكبر من ذلك. لو فشل التصغير نرسل الصورة كما هي.
  async function shrink(file) {
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bmp.width * scale);
      canvas.height = Math.round(bmp.height * scale);
      canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(ok => canvas.toBlob(ok, "image/jpeg", 0.85));
      return blob ? new File([blob], "photo.jpg", { type: "image/jpeg" }) : file;
    } catch (e) {
      return file;
    }
  }

  async function analyze(file) {
    if (!file) return;
    lastData = null;
    setStatus("");
    $("photo").src = URL.createObjectURL(file);
    $("photoBox").classList.add("scanning");           // خط المسح
    $("loadingText").classList.remove("hidden");
    $("resultBody").classList.add("hidden");
    showView("result");

    const form = new FormData();
    form.append("file", await shrink(file));
    try {
      const res = await fetch("/api/analyze", { method: "POST", body: form });
      const data = await res.json().catch(() => ({}));       // لو الرد ليس JSON (مثل خطأ من الاستضافة)
      if (!res.ok) throw new Error(data.detail || t("errorGeneric"));
      lastData = data;
      analysisId = data.analysis_id;
      fillResult(data);
    } catch (err) {
      showView("home");
      setStatus(err.message || t("errorGeneric"), true);
    } finally {
      $("photoBox").classList.remove("scanning");
      $("loadingText").classList.add("hidden");
      $("camInput").value = ""; $("fileInput").value = "";
    }
  }

  function fillResult(data) {
    $("resultBody").classList.remove("hidden");
    $("againBtn").classList.remove("hidden");
    $("found").classList.toggle("hidden", !data.recognized);
    $("notFound").classList.toggle("hidden", data.recognized);
    if (!$("thanks").classList.contains("done")) $("feedbackBox").classList.remove("hidden");

    if (!data.recognized) {
      $("resName").textContent = t("unknownTitle");
      $("resEn").textContent = "";
      $("resConf").classList.add("hidden");
      return;
    }
    const v = data.variety;
    $("resName").textContent = lang === "ar" ? v.name_ar : v.name_en;
    $("resEn").textContent = lang === "ar" ? v.name_en : v.name_ar;
    $("resDesc").textContent = v.description || "";
    $("resConf").classList.remove("hidden");
    $("resConf").textContent = data.confidence < 0.6 ? t("lowConf")
      : `${t("confidence")} ${Math.round(data.confidence * 100)}%`;
    if (data.demo) $("resConf").textContent = (lang === "ar" ? "نتيجة تجريبية (محاكاة)" : "Demo result (simulated)");
    $("vCal100").textContent = fmt(v.calories_per_100g);
    $("vSugar").textContent = fmt(v.sugar_per_100g);
    $("vCalOne").textContent = fmt(v.calories_per_date);
  }

  $("againBtn").onclick = () => {
    lastData = null;
    $("thanks").classList.remove("done"); $("thanks").classList.add("hidden");
    $("wrongBox").classList.add("hidden");
    showView("home");
  };

  /* ============ رأي المستخدم ============ */
  async function loadVarieties() {
    if (varietyList.length) return;
    try { varietyList = await (await fetch("/api/varieties")).json(); } catch (e) {}
  }

  $("noBtn").onclick = async () => {
    await loadVarieties();
    $("correctSelect").innerHTML = "";
    varietyList.forEach(v => {
      const o = document.createElement("option");
      o.value = v.name_ar;                                   // نحفظ الاسم العربي دائماً
      o.textContent = lang === "ar" ? v.name_ar : v.name_en;
      $("correctSelect").appendChild(o);
    });
    $("wrongBox").classList.remove("hidden");
  };
  $("yesBtn").onclick = () => sendFeedback(true);
  $("sendWrongBtn").onclick = () => sendFeedback(false);

  async function sendFeedback(correct) {
    await fetch(`/api/analyses/${analysisId}/feedback`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ correct, corrected_variety: correct ? null : $("correctSelect").value })
    });
    $("feedbackBox").classList.add("hidden");
    $("thanks").classList.remove("hidden"); $("thanks").classList.add("done");
  }


  /* ============ التشغيل الأول ============ */
  applyLang();
  loadVarieties();
  // شاشة الافتتاح تظهر مرة واحدة في الجلسة
  let seen = false;
  try { seen = sessionStorage.getItem("nawahSplash") === "1"; sessionStorage.setItem("nawahSplash", "1"); } catch (e) {}
  if (seen) { $("splash").classList.add("hidden"); }
  else { setTimeout(() => $("splash").classList.add("out"), 1500); setTimeout(() => $("splash").classList.add("hidden"), 2200); }
</script>
</body>
</html>
